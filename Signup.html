<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Style.css">
    <title>Signup</title>
</head>

<body>
    <main>
        <div class="form-box">
            <h1>Create Account</h1>
            <p class="subtittle">Join us today by filling out info</p>
            <form action="">
                <div class="input-group">
                    <label for="fullname">Fullname</label>
                    <input type="text" name="signupfullname" id="fullname">
                    <div class="input-group">
                    </div>
                    <label for="email">Email Address</label>
                    <input type="email" name="email" id="email">
                    <div>
                    </div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" name="Signup-password" id="password">
                </div>
                <button type="submit" class="signup-btn">Signup</button>
            </form>
            <p class="switch-text">Already have an account?
                <a href="./Signin.html" class="switch-link">Sign in</a>


            </p>
        </div>
    </main>
</body>

</html>
